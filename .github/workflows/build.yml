name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATCHES_PARQUET_URL: https://raw.githubusercontent.com/amundfylling/Scorpion-Scraper-2.0/main/data/scraped_matches.parquet
      PLAYERS_CSV_URL: https://raw.githubusercontent.com/amundfylling/Scorpion-Scraper-2.0/main/data/players_data.csv
      TOURNAMENTS_CSV_URL: https://raw.githubusercontent.com/amundfylling/Scorpion-Scraper-2.0/main/data/tournament_data.csv
      REQUIRE_RANKINGS: "1"
      MIN_RANKING_ROWS: "1000"
      MAX_RANKING_AGE_DAYS: "45"
      REQUIRE_TOURNAMENT_METADATA: "1"
      MIN_TOURNAMENT_LEVELS: "1000"
      MAX_MAIN_REJECTION_RATE: "0.01"
      MAX_EXTRA_REJECTION_RATE: "0.40"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build H2H data
        run: python scripts/build_h2h.py

      - name: Validate JavaScript syntax
        run: find public functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run frontend and Pages Function tests
        run: node --test tests-js/*.test.mjs

      - name: Validate H2H data
        run: python -m unittest discover -s tests -v

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
