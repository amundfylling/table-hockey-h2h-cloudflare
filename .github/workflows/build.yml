name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily data refresh. Runs whose sources match the live site stop after the download.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull request runs cancel each other. On main, a newer run waits instead: the daily
  # run skips when the sources are unchanged, so if it cancelled a code push mid-build, that
  # push would not be deployed until the data next changed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATCHES_PARQUET_URL: https://raw.githubusercontent.com/amundfylling/Scorpion-Scraper-2.0/main/data/scraped_matches.parquet
      PLAYERS_CSV_URL: https://raw.githubusercontent.com/amundfylling/Scorpion-Scraper-2.0/main/data/players_data.csv
      TOURNAMENTS_CSV_URL: https://raw.githubusercontent.com/amundfylling/Scorpion-Scraper-2.0/main/data/tournament_data.csv
      REQUIRE_RANKINGS: "1"
      MIN_RANKING_ROWS: "1000"
      MAX_RANKING_AGE_DAYS: "45"
      REQUIRE_TOURNAMENT_METADATA: "1"
      MIN_TOURNAMENT_LEVELS: "1000"
      MAX_MAIN_REJECTION_RATE: "0.01"
      MAX_EXTRA_REJECTION_RATE: "0.40"
      # Print build progress as it happens, so the log timestamps show which phase is slow.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build H2H data
        id: build
        env:
          # Only the daily run may skip: code changes always rebuild and deploy.
          SKIP_IF_SOURCES_MATCH_URL: ${{ github.event_name == 'schedule' && 'https://h2h.puck.no/data/meta.json' || '' }}
        run: python scripts/build_h2h.py

      - name: Validate JavaScript syntax
        if: steps.build.outputs.changed == 'true'
        run: find public functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run frontend and Pages Function tests
        if: steps.build.outputs.changed == 'true'
        run: node --test tests-js/*.test.mjs

      - name: Validate H2H data
        if: steps.build.outputs.changed == 'true'
        run: python -m unittest discover -s tests -v

      - name: Install accessibility check tools
        if: steps.build.outputs.changed == 'true'
        run: |
          npm ci
          # The check runs headless, so only the headless shell is needed, not full Chrome.
          npx playwright install --with-deps --only-shell chromium

      - name: Check accessibility
        if: steps.build.outputs.changed == 'true'
        run: npm run a11y

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && steps.build.outputs.changed == 'true'
        # Pinned to a commit (v4.1.3): this step holds the Cloudflare deploy token.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
